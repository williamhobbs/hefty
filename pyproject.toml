[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hefty"
version = "0.3.1"
description = "Some (relatively) lightweight short-term energy forecasting tools for solar, wind, and load."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name="Will Hobbs" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "herbie-data[scikit-learn] >= 2026.9.2",
    "pvlib >= 0.16.1",
    "pandas >= 3.0.0",
    "numpy",
    "xarray",
    "urllib3 >= 2.6.0",
]
license = "BSD-3-Clause"
license-files = ["LICENSE*"]

[project.optional-dependencies]
cams = ["cdsapi"]
dynamical = ["dynamical-catalog", "cartopy"]

[project.urls]
Homepage = "https://github.com/williamhobbs/hefty"
Issues = "https://github.com/williamhobbs/hefty/issues"

[tool.deptry.per_rule_ignores]
# urllib3 is not imported directly; it is a floor pin for intermittent SSL errors (see README)
DEP002 = ["urllib3"]